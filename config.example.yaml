# AuctionScan configuration. Copy to config.yaml and put YOUR numbers in.
# The defaults below are placeholders -- the system is only as good as these.

home_zip: "30303"

buy_box:
  min_year: 2017
  max_year: 2024
  max_odometer: 120000
  min_wholesale_value: 6000
  max_wholesale_value: 40000

  # The gross you demand before a car is worth buying. Whichever is larger.
  target_gross: 1200
  target_gross_pct: 0.06

  # Empty allowed_makes means "anything not excluded".
  allowed_makes: []
  excluded_makes: ["Maserati", "Alfa Romeo", "Fiat", "Land Rover"]

  # Risk tolerance. Loosen these only if you have the retail channel for it.
  allow_branded_title: false
  allow_structural_damage: false
  allow_airbag_deployed: false
  max_accidents: 1
  min_grade: 3.0
  max_recon: 2500

costs:
  buy_fee: 400              # your average auction buy fee
  transport_per_mile: 1.15
  transport_minimum: 150
  default_transport_miles: 250
  floorplan_daily: 9.0
  baseline_recon: 450       # detail + safety check even on a clean car
  recon_safety_multiplier: 1.25   # photo estimates run light; pad them

# Repairs you can do in-house, at your cost. This is your edge: the lane
# prices a repair at what it costs the average buyer. Leave one null if you
# can't price it -- the tool keeps market cost and demands more gross.
capabilities:
  ev_battery_pack: null
  ev_drive_unit: null
  engine: null
  transmission: null
  unpriced_powertrain_min_gross: 4000

# A wholesale flip and a fix-and-retail are different businesses. Both get
# scored; the better exit wins.
exits:
  - name: wholesale
    enabled: true
    days_held: 21
    sell_fee: 300           # fee to re-run it through the lane
    recon_multiplier: 1.0
    target_gross: 1200
    target_gross_pct: 0.06
  - name: retail
    enabled: false          # turn on if you retail what you buy
    days_held: 45
    sell_fee: 0
    recon_multiplier: 1.6   # retail-ready costs more than lane-ready
    target_gross: 2500
    target_gross_pct: 0.10

model: claude-opus-5
use_ai_condition: true
max_photos_per_vehicle: 8
