# Working config for a shop that fixes broken EVs in-house.
# Numbers marked TODO are placeholders -- replace with your real ones.
# The hourly agent scores every car with this file, so a wrong number here
# moves every max bid it sends you. Keep the extension's Setup page in step.

home_zip: "13088"             # Liverpool, NY -- transport is priced to here

buy_box:
  min_year: 2015
  max_odometer: 160000
  min_wholesale_value: 5000
  max_wholesale_value: 60000
  target_gross: 1200
  target_gross_pct: 0.06
  min_grade: 0.0              # broken cars grade badly by definition
  max_recon: 6000
  allow_inoperable: true      # this is the niche, not a disqualifier
  allow_as_is_inop: true
  max_powertrain_reserve: 12000
  max_risk_spread: 5000
  allow_branded_title: false
  allow_structural_damage: false
  allow_airbag_deployed: false
  max_accidents: 1

capabilities:
  ev_battery_pack: 3500       # confirmed
  ev_drive_unit: 2000         # confirmed
  engine: null                # priced per job
  transmission: null          # priced per job
  # Engines and transmissions: only when there's good money on the table.
  unpriced_powertrain_min_gross: 4000

exits:
  - name: wholesale
    enabled: true
    days_held: 21
    sell_fee: 300             # TODO - your average
    recon_multiplier: 1.0
    target_gross: 1200
    target_gross_pct: 0.06
  - name: retail
    enabled: true
    days_held: 45             # TODO - your real turn time on a fixed EV
    sell_fee: 0
    recon_multiplier: 1.6
    target_gross: 2500
    target_gross_pct: 0.10

costs:
  buy_fee: 400                # TODO - your average buy fee
  transport_per_mile: 1.15
  transport_minimum: 150
  default_transport_miles: 250
  floorplan_daily: 9.0        # TODO - your floorplan rate
  baseline_recon: 450
  recon_safety_multiplier: 1.25

model: claude-opus-5
use_ai_condition: true
max_photos_per_vehicle: 8
