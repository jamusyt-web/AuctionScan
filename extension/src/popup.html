<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AuctionScan</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #15191f; --muted: #5b6573; --line: #dde2e8;
    --card: #f6f8fa; --good: #12603a; --good-bg: #dff1e6; --warn: #8a2a1e;
    --accent: #2d4fb3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d; --fg: #e4e8ee; --muted: #9aa5b4; --line: #2a313b;
      --card: #1b2027; --good: #7fd4a6; --good-bg: #173326; --warn: #f2a094;
      --accent: #9fb4f5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 400px; background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 15px; }
  #status { color: var(--muted); }
  #picks { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  button {
    font: inherit; font-weight: 600; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button:disabled { opacity: .5; cursor: default; }
  #list { max-height: 330px; overflow-y: auto; }
  .find { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .find:hover { background: var(--card); }
  .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .score { min-width: 28px; text-align: center; border-radius: 4px; padding: 0 6px; }
  .score.good { background: var(--good-bg); color: var(--good); }
  .act { margin-top: 2px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .flags { color: var(--warn); font-size: 12px; margin-top: 2px; }
  .empty { padding: 18px 14px; color: var(--muted); text-align: center; }
  details { padding: 8px 14px 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  #diag {
    white-space: pre-wrap; font: 11px/1.4 ui-monospace, Consolas, monospace;
    color: var(--muted); margin: 6px 0 0; max-height: 220px; overflow: auto;
  }
</style>
</head>
<body>
  <header>
    <h1>AuctionScan</h1>
    <div id="status">Loading…</div>
    <div id="picks"></div>
  </header>
  <div class="bar">
    <button id="sweep" class="primary" type="button">Sweep now</button>
    <button id="options" type="button">Setup</button>
    <button id="export" type="button">Export CSV</button>
    <button id="clear" type="button">Clear finds</button>
  </div>
  <div id="list"></div>
  <details>
    <summary>What the last page reads saw</summary>
    <pre id="diag"></pre>
  </details>
  <script src="popup.js"></script>
</body>
</html>
